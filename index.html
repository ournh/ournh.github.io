<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Neighborhood Health - Zine</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f9f9f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #333;
        }
        .container {
            width: 100%;
            max-width: 1000px;
            text-align: center;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        h1 {
            margin-top: 0;
            font-size: 2rem;
            color: #111;
        }
        p {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }
        .zine-wrapper {
            position: relative;
            width: 100%;
            /* Ensures an optimal responsive aspect ratio on larger devices */
            padding-top: 75%; 
        }
        @media (min-width: 768px) {
            .zine-wrapper {
                padding-top: 56.25%; /* Switches to standard wide display for computers */
            }
        }
        .zine-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100% !important; 
            border: 1px solid #e0e0e0;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Our Neighborhood Health</h1>
        <p>Welcome to our official zine. Flip through the pages below to explore our community resources and connection hubs.</p>
        
        <div class="zine-wrapper">
            <!-- Custom Heyzine Embed Component -->
            <iframe allowfullscreen allow="autoplay; fullscreen; clipboard-write" scrolling="no" src="https://heyzine.com/flip-book/ce5935ff77.html"></iframe>

    </div>

</body>
