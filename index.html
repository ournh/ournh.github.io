<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Neighborhood Health - Zine</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f9f9f9;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 1000px;
            text-align: center;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        h1 {
            margin-top: 0;
            font-size: 2rem;
            color: #111;
        }
        p {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }
        iframe {
            width: 100%;
            height: 600px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            margin-bottom: 30px;
        }
        .qr-section {
            margin-top: 20px;
            padding: 20px;
            border-top: 1px solid #eee;
        }
        .qr-section p {
            font-size: 1rem;
            margin-bottom: 15px;
        }
        .fp-qr-logo {
            max-width: 150px;
            width: 100%;
            height: auto;
            transition: transform 0.2s ease;
        }
        .fp-qr-logo:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Our Neighborhood Health</h1>
        <p>Welcome to our official zine. Flip through the pages below to explore our community resources.</p>
        
        <!-- Embedded Main Zine -->
        <iframe allowfullscreen allow="autoplay; fullscreen; clipboard-write" scrolling="no" src="https://heyzine.com"></iframe>
        
        <!-- Secondary Zine QR Code Section -->
        <div class="qr-section">
            <p>Scan or click below to access our alternate community zine:</p>
            <a href="https://heyzine.com/flip-book/1cf538e1bb.html" target="_blank" class="heyzine-link fp-link">
                <img src="https://cdnm.heyzine.com/flip-book/qr-code/1cf538e1bb-669606.png?l=1&amp;dm=" alt="QR code" class="fp-qr-logo">
            </a>
        </div>
    </div>

</body>
</html>
